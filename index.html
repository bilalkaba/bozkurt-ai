
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bozkurt AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 800px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 18px;
      border-bottom: 1px solid #303744;
    }
    header h1 { margin: 0; color: #60a5fa; }
    header p { color: #aab4c3; }
    #chat {
      flex: 1;
      padding: 20px 0;
    }
    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 14px 16px;
      border-radius: 14px;
      margin: 12px 0;
      line-height: 1.6;
    }
    .user {
      background: #1d4ed8;
      margin-left: 15%;
    }
    .bot {
      background: #202733;
      margin-right: 8%;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      position: sticky;
      bottom: 0;
      background: #10131a;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #414b5b;
      border-radius: 12px;
      background: #1b2230;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    footer {
      text-align: center;
      color: #8b95a5;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🐺 Bozkurt AI</h1>
      <p>Türkçe yapay zekâ asistanın</p>
    </header>

    <section id="chat" aria-live="polite">
      <div class="message bot">
        Merhaba! Ben Bozkurt AI. Sana nasıl yardımcı olabilirim?
      </div>
    </section>

    <form id="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Mesajını yaz kanka..."
        autocomplete="off"
        required
      >
      <button id="send-button" type="submit">Gönder</button>
    </form>

    <footer>Bozkurt AI · Yapay zekâ destekli asistan</footer>
  </main>

  <script>
    const API_URL = "https://bozkurt-ai-api.bilalkabaa5454.workers.dev/";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const button = document.getElementById("send-button");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      message.scrollIntoView({ behavior: "smooth", block: "end" });
      return message;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      button.disabled = true;
      input.disabled = true;

      const waiting = addMessage("Bozkurt AI düşünüyor...", "bot");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Sunucuda bir sorun oluştu.");
        }

        waiting.textContent = data.reply || "Yanıt alınamadı.";
      } catch (error) {
        waiting.textContent =
          "Kanka, sunucuya bağlanamadım. İnternet bağlantısını veya API sunucusunu kontrol et.";
        console.error(error);
      } finally {
        button.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
